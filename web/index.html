<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primal Instinct — Integrity Audit</title>
<link rel="stylesheet" href="./brand.css">
<style>
  /* All colour and type tokens come from brand.css. Nothing is declared here. */
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--font-body);font-size:15px;line-height:1.65;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto;padding:var(--s7) var(--s5) var(--s8)}
  h1{font-family:var(--font-display);font-weight:400;text-transform:uppercase;
     font-size:clamp(38px,5.6vw,64px);line-height:1.02;
     letter-spacing:var(--display-tracking);margin:0 0 var(--s3)}
  h2{font-family:var(--font-display);font-weight:400;text-transform:uppercase;
     font-size:27px;letter-spacing:var(--display-tracking);margin:var(--s8) 0 var(--s2)}
  h3{font-size:15px;font-weight:600;margin:0 0 var(--s2)}
  .sub{color:var(--muted);margin:0 0 var(--s2)}
  .eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:var(--eyebrow-tracking);
     color:var(--accent);font-weight:700;margin:0 0 var(--s3)}
  .lede{max-width:68ch;color:var(--muted)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s5)}
  .grid{display:grid;gap:var(--s3)}
  .g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
  .g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
  .g4{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s4)}
  .stat .n{font-family:var(--font-display);font-weight:400;font-size:38px;
    letter-spacing:var(--display-tracking);line-height:1.05}
  .stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;
    margin-top:var(--s2);font-weight:600}
  .stat .f{font-size:12.5px;color:var(--muted);margin-top:var(--s2)}
  .banner{border:1px solid var(--warn);border-left:4px solid var(--warn);
    background:color-mix(in srgb,var(--warn) 8%,transparent);
    border-radius:var(--r-md);padding:var(--s4) var(--s5);margin:var(--s5) 0 var(--s2)}
  .banner strong{color:var(--warn)}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:var(--r-pill);
    text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
  .t-closed{background:color-mix(in srgb,var(--won) 17%,transparent);color:var(--won)}
  .t-follow{background:color-mix(in srgb,var(--warn) 17%,transparent);color:var(--warn)}
  .t-lost{background:color-mix(in srgb,var(--lost) 17%,transparent);color:var(--lost)}
  .chip{display:inline-block;background:var(--chip);border:1px solid var(--line);
    border-radius:var(--r-pill);padding:3px 11px;font-size:12px;margin:0 5px 5px 0;color:var(--muted)}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);
    border-radius:var(--r-lg);background:var(--panel)}
  table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
  th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;
     background:var(--panel-2);position:sticky;top:0}
  tbody tr:last-child td{border-bottom:none}
  .bar{height:6px;border-radius:var(--r-pill);background:var(--chip);overflow:hidden;margin-top:7px}
  .bar > i{display:block;height:100%;background:var(--accent);border-radius:var(--r-pill)}
  .q{border-left:3px solid var(--accent);padding:2px 0 2px var(--s4);margin:var(--s2) 0;
     color:var(--muted);font-style:italic}
  .mono{font-family:var(--font-mono);font-size:12px}
  details{border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);
    padding:var(--s3) var(--s4);margin-bottom:var(--s2)}
  summary{cursor:pointer;font-weight:600;list-style:none;font-size:14.5px}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ ";color:var(--accent)}
  details[open] summary::before{content:"▾ "}
  footer{margin-top:var(--s8);padding-top:var(--s5);border-top:1px solid var(--line);
    color:var(--muted);font-size:13px}
  .warnrow{background:color-mix(in srgb,var(--warn) 6%,transparent)}
  /* Bucket box. The page reports themes with rates, not enumerations, so this
     is the workhorse: one box per bucket, always the same four parts —
     headline number, label, denominator, and a sentence saying what it is. */
  .box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:var(--s4);display:flex;flex-direction:column;gap:9px}
  .box .big{font-family:var(--font-display);font-weight:400;font-size:34px;line-height:1;
    letter-spacing:var(--display-tracking)}
  .box h4{margin:0;font-size:14.5px;font-weight:700;line-height:1.35}
  .box .meta{font-size:11px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.09em;font-weight:600}
  .box p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.55}
  .box .foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);
    flex-wrap:wrap;margin-bottom:var(--s5)}
  .topbar a{color:var(--muted);text-decoration:none;font-size:13px;
    border:1px solid var(--line);border-radius:var(--r-pill);padding:6px 14px}
  .topbar a:hover{color:var(--accent);border-color:var(--accent)}
  .num{font-family:var(--font-display);font-weight:400;letter-spacing:var(--display-tracking)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="eyebrow" style="margin:0">Primal Instinct</span>
    <span>
      <a href="#" onclick="const r=document.documentElement;
         r.dataset.theme=r.dataset.theme==='light'?'dark':'light';return false;">Theme</a>
    </span>
  </div>
  <div id="app">Loading…</div>
</div>

<script>
const LABEL = {
  closed:["Closed","t-closed"], follow_up:["Follow Up","t-follow"],
  lost:["Lost","t-lost"], undetermined:["Undetermined","t-follow"]
};
const AVATARS = {
  the_optimizer:{name:"The Optimizer",
    blurb:"Already fit, already successful, already pays for coaching elsewhere. Hit a milestone age and reframed fitness around longevity and function. Not shopping on price — shopping on fit.",
    tell:"“I'm actually more interested in it because of the fact that it costs six grand.”"},
  the_rebuilder:{name:"The Rebuilder",
    blurb:"Lost ground to something outside their control — illness, injury, a hard season. Wants their former self back, not a new peak. Carries visible regret about lost time.",
    tell:"“I wish I could have started sooner.”"},
  the_warm_referral:{name:"The Warm Referral",
    blurb:"Arrives already sold. A partner, spouse or friend is in the program and has pre-framed both the results and the price. Objection handling gets spent on logistics, not money.",
    tell:"Price never raised at any point in the call."},
  skeptical_bargain_hunter:{name:"The Skeptical Bargain Hunter",
    blurb:"Self-directed and capable. Anchored to a cheap alternative that genuinely worked for them. Sees coaching as information they could source themselves. Price gap is an order of magnitude, not a margin.",
    tell:"“It's a big difference from 29 bucks a month to 6K.”"},
  the_medically_constrained:{name:"The Medically Constrained",
    blurb:"High intent, no price resistance — blocked by a clinician. An active care team overrides the rep. The question is whether the program works at reduced scope.",
    tell:"“Is there enough value for me to just work on lower body stuff?”"}
};
const OBJ_LABEL = {
  price:"Price / sticker shock", affordability:"Affordability — cash not available",
  timing_cashflow:"Timing — cash committed elsewhere", value_vs_cheaper_alternative:"Cheaper alternative exists",
  icp_mismatch:"“Am I even your customer?”", program_longevity_proof:"Will results actually last?",
  unfamiliar_modality:"Never done kettlebells", life_event_conflict:"Life event in the way",
  medical_program_fit:"Medical — program may not fit", value_at_reduced_scope:"Worth it at reduced scope?",
  risk_of_harm:"Fear of making an injury worse", timing_medical:"Timing — mid-treatment",
  think_about_it:"“Let me think about it”", spouse_consult:"Needs to ask a partner",
  fear_doubt:"General doubt it will work", trust_provider:"Doesn't yet trust the provider",
  timing_other:"Timing — something else first", program_fit:"Program may not suit them",
  other:"Uncategorised"
};
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
const adhVals = cs => cs.map(c=>c.adherence?.adherence_pct).filter(v=>v!=null);
const meanAdherence = cs => { const v=adhVals(cs); return v.length ? Math.round(v.reduce((a,b)=>a+b,0)/v.length) : 0; };
const adherenceRange = cs => { const v=adhVals(cs); return v.length ? Math.min(...v)+"–"+Math.max(...v)+"%" : "n/a"; };
/* Close rate uses one colour scale everywhere on the page. */
const rateTone = r => r>=30?"var(--won)":r>=15?"var(--warn)":"var(--lost)";
/* One bucket, rendered as a box. The page reports themes with rates rather
   than enumerating what is in them, so this is the repeated unit:
   o = {big, tone, label, meta, blurb, bar, foot}. */
function box(o){
  const tone = o.tone || "var(--ink)";
  return `<div class="box"${o.tone?` style="border-color:${o.tone}"`:""}>
    <div class="big" style="color:${tone}">${o.big}</div>
    <h4>${esc(o.label)}</h4>
    ${o.bar!=null?`<div class="bar"><i style="width:${Math.min(100,o.bar)}%;background:${tone}"></i></div>`:""}
    ${o.meta?`<div class="meta">${o.meta}</div>`:""}
    ${o.blurb?`<p>${esc(o.blurb)}</p>`:""}
    ${o.foot?`<div class="foot">${o.foot}</div>`:""}
  </div>`;
}

// Distinguish a fetch failure from a render failure. Conflating them cost a
// debugging cycle once: the data loaded fine and render() threw, but the page
// said "could not load data.json" and swallowed the stack.
/* LOADER:START — build_standalone.py replaces everything between these two
   markers with the payload inlined. Do not remove them, and do not rely on
   matching the fetch call itself: a non-greedy match for the end of this block
   ran on into render() and silently shipped a standalone page with no render
   function at all. */
(async () => {
  let data;
  try {
    const res = await fetch("./data.json");
    if (!res.ok) throw new Error("HTTP " + res.status);
    data = await res.json();
  } catch (e) {
    console.error("data load failed", e);
    document.getElementById("app").innerHTML =
      "<h1>Could not load data.json</h1><p class='sub'>" + esc(e.message) + "</p>";
    return;
  }
  try {
    render(data);
  } catch (e) {
    console.error("render failed", e);
    document.getElementById("app").innerHTML =
      "<h1>Render failed</h1><p class='sub'>The data loaded (" +
      (data.calls || []).length + " calls) but the page could not draw it.</p>" +
      "<pre class='mono' style='white-space:pre-wrap;color:var(--lost)'>" +
      esc(e.stack || e.message) + "</pre>";
  }
})();
/* LOADER:END */

function render(d){
  window.__D = d;
  const calls = d.calls;
  const n = calls.length;
  const closed = calls.filter(c=>c.outcome.disposition==="closed");
  const notClosed = calls.filter(c=>c.outcome.disposition!=="closed");
  const cash = calls.reduce((s,c)=>s+(c.outcome.cash_collected_usd||0),0);
  const verified = closed.filter(c=>c.outcome.confidence>=0.9).length;

  const objs = calls.flatMap(c=>(c.objections||[]).map(o=>({...o, call:c})));
  const byType = {};
  objs.forEach(o=>{ (byType[o.type] ??= {n:0,r:0,items:[]}); byType[o.type].n++;
                    if(o.resolved) byType[o.type].r++; byType[o.type].items.push(o); });
  const objRows = Object.entries(byType).sort((a,b)=>b[1].n-a[1].n||b[1].r-a[1].r);

  const el = document.getElementById("app");
  el.innerHTML = `
  <p class="eyebrow">${esc(d.rules_window || "2026")} · ${d.corpus.deals} deals</p>
  <h1>Primal Instinct — Integrity Audit</h1>
  <p class="lede">Every sales call broken into its component parts — avatar, goals, pains, objections,
  outcome — then compared. <strong>${n} calls</strong> across <strong>${d.corpus.deals} deals</strong>,
  ${esc(d.rules_window || "May–July 2026")}. Internal team meetings, training and manager 1-1s are
  reviewed for integrity findings but excluded from every sales metric.</p>

  <div class="banner">
    <strong>Read this before you trust a number.</strong>
    Outcomes here are <strong>inferred from transcript language</strong>, not joined to a CRM.
    A call that ends in “let me think about it” and closes by text three days later reads as a
    follow-up here, forever. Every figure carries a confidence score.
    <br><br>
    <strong>Close rule in force:</strong> a verbal agreement to move forward plus a payment link sent
    counts as closed, even where the transcript ends before payment confirms. Applied uniformly across
    all ${n} calls. It overstates against any deal that agreed and never paid — and separately,
    recordings that stop at the moment payment is taken mean the true close rate is likely
    <em>higher</em> than the ${pct(closed.length,n)}% shown. Those two biases push in opposite
    directions and neither is quantified without a CRM join.
  </div>

  <div class="grid g4" style="margin-top:16px">
    ${stat(n,"Calls ingested","5 reps · 5 outcomes")}
    ${stat(closed.length+"/"+n,"Closed","inferred · "+pct(closed.length,n)+"%")}
    ${stat("$"+cash.toLocaleString(),"Cash confirmed","payment verified on call")}
    ${stat(meanAdherence(calls)+"%","Mean script adherence","range "+adherenceRange(calls))}
  </div>
  <p class="sub" style="margin-top:8px">${verified} of ${closed.length} closes sit at ≥0.90 confidence.
  Cash combines $6,000 confirmed live with a $7,200 payment-plan contract value
  ($1,200 × 6) — contract value, not same-day cash.</p>

  ${closedVsNotSection(d, calls, closed, notClosed)}

  ${flagsSection(d)}
  ${funnelSection(d)}

  ${objectionSection(d, objs, n)}

  ${scriptSection(calls, d.playbook)}

  ${discriminatorSection(d)}
  ${avatarSection(d)}
  ${icpSection(d)}
  ${painGoalSection(d)}
  ${offerSection(d)}
  ${callTableSection(d)}

  <footer>
    <strong>Primal Instinct — Integrity Audit.</strong>
    ${d.corpus.calls_ingested} calls → ${d.corpus.deals} deals · generated ${esc(d.generated_at.slice(0,10))} ·
    ${d.counts.goals} goals, ${d.counts.pains} pains, ${d.counts.objections} objections,
    ${d.counts.check_scores} script checks scored.<br>
    Source of truth is <span class="mono">data/calls/*.json</span>; queryable copy in
    <span class="mono">data/primal.db</span>. Rebuild with <span class="mono">python3 src/build_db.py</span>.
    Outcomes are transcript-inferred and not CRM-verified.
  </footer>`;

  /* ---------- Objections, in four buckets ---------- */
  function objectionSection(d, objs, n){
    const G = d.rollups.objection_groups || [];
    const resolved = objs.filter(o=>o.resolved).length;
    const worst = [...G].filter(g=>g.n>=50).sort((a,b)=>a.rate-b.rate)[0];
    const biggest = G[0];
    return `
  <h2>Objections — what we face, what we actually resolve</h2>
  <p class="sub">${objs.length} objections across ${n} calls, ${resolved} resolved
  (${pct(resolved,objs.length)}%). The ${(d.rollups.objection_types||[]).length} recorded objection types
  collapse into ${G.filter(g=>g.key!=="other").length} things people actually say. Rates are computed over
  every objection in the corpus, not over the buckets shown.</p>

  <div class="grid g2" style="margin:var(--s4) 0 var(--s3)">
    ${G.map(g=>box({
      big: g.rate+"%", tone: g.rate>=35?"var(--won)":g.rate>=20?"var(--warn)":"var(--lost)",
      label: g.label, bar: g.rate,
      meta: `resolved · ${g.n} raised · ${g.share}% of all objections`,
      blurb: g.blurb,
      foot: g.types.slice(0,4).map(t=>
        `<span class="chip">${esc(OBJ_LABEL[t.type]||t.type.replace(/_/g," "))} ×${t.n}</span>`).join("")
    })).join("")}
  </div>

  <div class="panel" style="border-color:var(--lost)">
    <h3 style="color:var(--lost)">Nearly half of everything you hear is one bucket</h3>
    <p style="color:var(--muted);margin:0">${biggest ? `<strong>${esc(biggest.label)}</strong> is
    ${biggest.share}% of all objections raised and resolves ${biggest.rate}% of the time —
    ${biggest.n} raised, ${biggest.resolved} resolved.` : ""}
    ${worst && biggest && worst.key!==biggest.key ? ` The lowest resolve rate is
    <strong>${esc(worst.label)}</strong> at ${worst.rate}%, which is the harder problem but a third of the
    volume.` : ""}
    One drilled response to the biggest bucket is worth more than a complete playbook for the rest, because
    the volume is not close.</p>
  </div>

  <p class="sub" style="margin-top:var(--s3)">One caveat: which <em>rebuttal</em> works is not shown, because
  the tactic label was captured as free text rather than from a fixed vocabulary — two reps doing the same
  thing get two different labels, so nothing reaches a countable threshold. Counts and resolve rates are
  unaffected. Fixing it needs a controlled vocabulary and a re-score, not a re-extraction.</p>`;
  }

  /* ---------- Script adherence, by section of the script ---------- */
  function scriptSection(calls, pb){
    const R = window.__D.rollups;
    const ph = R.phases;                       // playbook order — this is a sequence
    const totEarned = ph.reduce((s,p)=>s+(p.adherence_pct??0)*p.calls_scored,0);
    const totCalls  = ph.reduce((s,p)=>s+p.calls_scored,0);
    const overall   = totCalls ? Math.round(totEarned/totCalls) : 0;
    const weakest   = ph.find(p=>p.phase_id===R.weakest_phase_id);

    const plays = R.objection_plays;
    const totTrig = plays.reduce((s,p)=>s+p.triggered,0);
    const totFull = plays.reduce((s,p)=>s+p.hit,0);
    // Flatten every check out of its section. Seven accordions each holding a
    // full table is the same data spread over seven scrolls; one ranked list
    // answers the only question anyone asks of it — what do we drill first.
    const allChecks = ph.flatMap(p=>p.checks.filter(c=>c.pct!=null)
                                     .map(c=>({...c, phase:p.name})))
                        .sort((a,b)=>a.pct-b.pct);

    return `
  <h2>Script adherence by section</h2>
  <p class="sub">Every call scored against <strong>${esc(pb.name)}</strong>, then rolled up by section.
  This answers “how are we running the script overall”, not “how did one rep do”. Listed in
  <strong>script order</strong>, because these run as a sequence and a process is unreadable when sorted by
  score. Sections a call could not reach — a follow-up call has no baseline phase — drop out of that
  section's denominator rather than counting as a failure.</p>

  <div class="grid g4" style="margin:var(--s4) 0">
    ${stat(overall+"%","Overall adherence","across all sections")}
    ${stat(weakest ? weakest.adherence_pct+"%" : "—","Weakest section",weakest ? weakest.name : "")}
    ${stat(totTrig,"Scripted objections hit","across the corpus")}
    ${stat(totFull+"/"+totTrig,"Objection plays fully run","")}
  </div>

  <div class="scroll" style="margin-bottom:var(--s3)"><table>
    <thead><tr>
      <th>Section</th><th style="width:190px">Adherence</th>
      <th style="width:150px">Calls</th><th style="width:70px">Weight</th>
    </tr></thead>
    <tbody>${ph.map((p,i)=>{
      const v=p.adherence_pct, col = v==null?"var(--muted)":v>=70?"var(--won)":v>=45?"var(--warn)":"var(--lost)";
      const isWeak = p.phase_id===R.weakest_phase_id;
      return `<tr${isWeak?' class="warnrow"':""}>
        <td><span class="mono" style="color:var(--muted)">${i+1}.</span>
            <strong>${esc(p.name)}</strong>
            ${isWeak?' <span class="tag t-lost">weakest</span>':""}
            <div style="color:var(--muted);font-size:12.5px">${esc(p.intent)}</div></td>
        <td><span class="num" style="font-size:24px;color:${col}">${v==null?"—":v+"%"}</span>
            <div class="bar"><i style="width:${v||0}%;background:${col}"></i></div></td>
        <td style="font-size:12.5px;color:var(--muted)">
            <span style="color:var(--won)">${p.hit} hit</span> ·
            <span style="color:var(--warn)">${p.partial} part</span> ·
            <span style="color:var(--lost)">${p.miss} miss</span>
            ${p.not_applicable?` · ${p.not_applicable} n/a`:""}</td>
        <td class="mono" style="color:var(--muted)">${p.weight}</td>
      </tr>`;}).join("")}</tbody>
  </table></div>

  <h3 style="margin-top:var(--s6)">The coaching list — the twelve least-run moves</h3>
  <p class="sub">Every individual scripted move across all ${ph.length} sections, ranked by how often it
  actually gets run, worst first. ${allChecks.length} moves are scored in total; drilling the bottom twelve
  is the whole of the near-term coaching plan. The rest are at or above the corpus average and are not
  where the losses are.</p>
  <div class="scroll" style="margin-bottom:var(--s3)"><table>
    <thead><tr><th>Move</th><th style="width:150px">Section</th><th style="width:150px">Run</th>
      <th style="width:130px">Hit / part / miss</th></tr></thead>
    <tbody>${allChecks.slice(0,12).map(c=>{
      const col = c.pct>=70?"var(--won)":c.pct>=45?"var(--warn)":"var(--lost)";
      return `<tr><td style="font-size:13.5px">${esc(c.text)}</td>
        <td style="font-size:12px;color:var(--muted)">${esc(c.phase)}</td>
        <td><strong style="color:${col}">${c.pct==null?"—":c.pct+"%"}</strong>
            <div class="bar"><i style="width:${c.pct||0}%;background:${col}"></i></div></td>
        <td class="mono" style="color:var(--muted)">${c.hit} / ${c.partial} / ${c.miss}</td></tr>`;
    }).join("")}</tbody>
  </table></div>

  <h3 style="margin-top:var(--s6)">Objection plays</h3>
  <p class="sub">How often each scripted objection comes up, and how often the rep actually runs the play.</p>
  <div class="scroll" style="margin-bottom:var(--s3)"><table>
    <thead><tr><th>Objection</th><th style="width:110px">Triggered</th>
      <th style="width:220px">Play executed</th><th style="width:110px">Ran in full</th>
      <th style="width:110px">Partial</th><th style="width:110px">Not run</th></tr></thead>
    <tbody>${plays.map(p=>{
      const rate = pct(p.hit + p.partial*.5, p.triggered);
      const col = rate>=70?"var(--won)":rate>=35?"var(--warn)":"var(--lost)";
      const cell=(n,tone)=>`<span class="num" style="font-size:20px;color:${tone}">${n}</span>
        <span class="mono" style="color:var(--muted)"> ${pct(n,p.triggered)}%</span>`;
      return `<tr>
        <td><strong>${esc(p.trigger)}</strong>
            <div class="mono" style="color:var(--muted)">${esc(p.play)}</div></td>
        <td><span class="num" style="font-size:24px">${p.triggered}</span></td>
        <td><strong style="color:${col}">${rate}%</strong>
            <div class="bar"><i style="width:${rate}%;background:${col}"></i></div></td>
        <td>${cell(p.hit,"var(--won)")}</td>
        <td>${cell(p.partial,"var(--warn)")}</td>
        <td>${cell(p.miss,"var(--lost)")}</td>
      </tr>`;}).join("")}</tbody>
  </table></div>

  <div class="grid g2">
    <div class="panel" style="border-color:var(--lost)">
      <h3 style="color:var(--lost)">${esc(weakest?weakest.name:"")} is the corpus-wide hole</h3>
      <p style="color:var(--muted);margin:0">Running at <strong>${weakest?weakest.adherence_pct:0}%</strong>
      across every call scored, at a section weight of ${weakest?weakest.weight:0} — the joint-heaviest in the
      playbook. It is what makes standing still cost something, and it is the first thing to drill.</p>
    </div>
    <div class="panel" style="border-color:var(--warn)">
      <h3 style="color:var(--warn)">No objection play has ever been run in full</h3>
      <p style="color:var(--muted);margin:0">${totTrig} scripted objections triggered, ${totFull} plays run
      end to end. The script supplies the words; they are being improvised instead. Objection handling is the
      highest-leverage drill because the trigger language is predictable and repeatable.</p>
    </div>
  </div>

  <div class="banner" style="margin-top:var(--s4)">
    <strong>One caveat on reading adherence against outcome.</strong>
    Adherence and outcome were scored in the same pass, so knowing a call closed can make its discovery read
    as sharper than it was. Section-level rates are far more robust to that than per-call scores — a whole
    section being skipped is a countable fact, not a judgement — but blind scoring against CRM-verified
    outcomes is still what would settle it.
  </div>`;
  }

  /* ---------- Closed vs not closed, computed ---------- */
  function closedVsNotSection(d, calls, closed, notClosed){
    const R = d.rollups, D = R.discriminators;
    const rate = g => g.length ? Math.round(g.length) : 0;
    // structural facts, measured rather than asserted
    const has = (arr, fn) => arr.filter(fn).length;
    const planLive = g => pct(has(g, c=>c.offer && c.offer.payment_plan_structured_live), g.length);
    const planOffered = g => pct(has(g, c=>c.offer && c.offer.payment_plan_offered), g.length);
    const guarantee = g => pct(has(g, c=>c.offer && c.offer.guarantee_mentioned), g.length);
    const avgDur = g => { const v=g.map(c=>c.call.duration_min_est).filter(Boolean);
      return v.length ? Math.round(v.reduce((a,b)=>a+b,0)/v.length) : 0; };
    const adh = g => { const v=g.map(c=>c.adherence&&c.adherence.adherence_pct).filter(x=>x!=null);
      return v.length ? Math.round(v.reduce((a,b)=>a+b,0)/v.length) : 0; };
    const objRes = g => { const all=g.flatMap(c=>c.objections||[]);
      return pct(all.filter(o=>o.resolved).length, all.length); };

    const rows = [
      ["Mean script adherence", adh(closed)+"%", adh(notClosed)+"%"],
      ["Objections resolved", objRes(closed)+"%", objRes(notClosed)+"%"],
      ["Payment plan structured live", planLive(closed)+"%", planLive(notClosed)+"%"],
      ["Payment plan offered at all", planOffered(closed)+"%", planOffered(notClosed)+"%"],
      ["Guarantee mentioned", guarantee(closed)+"%", guarantee(notClosed)+"%"],
      ["Average call length", avgDur(closed)+" min", avgDur(notClosed)+" min"],
    ];

    const topWin = (D.top_favours_close||[]).filter(r=>["check","phase","phase_full","play"].includes(r.kind)).slice(0,4);
    const topLose = (D.top_favours_loss||[]).slice(0,4);

    return `
  <h2>Closed vs. not closed</h2>
  <p class="sub">The whole point of the audit. ${closed.length} closed against ${notClosed.length} not
  closed, measured rather than asserted — every figure below is computed from the corpus.</p>

  <div class="scroll" style="margin-bottom:var(--s3)"><table>
    <thead><tr><th>Measure</th><th style="width:150px;color:var(--won)">Closed</th>
      <th style="width:150px;color:var(--lost)">Not closed</th><th style="width:110px">Gap</th></tr></thead>
    <tbody>${rows.map(([label,a,b])=>{
      const na=parseFloat(a), nb=parseFloat(b), gap=Math.round(na-nb);
      const col = gap>0?"var(--won)":gap<0?"var(--lost)":"var(--muted)";
      return `<tr><td><strong>${esc(label)}</strong></td>
        <td><span class="num" style="font-size:20px;color:var(--won)">${a}</span></td>
        <td><span class="num" style="font-size:20px;color:var(--lost)">${b}</span></td>
        <td><strong style="color:${col}">${gap>0?"+":""}${gap}</strong></td></tr>`;}).join("")}</tbody>
  </table></div>

  <div class="grid g2">
    <div class="panel" style="border-color:var(--won)">
      <h3 style="color:var(--won)">Most enriched in closed deals</h3>
      <p class="sub" style="font-size:13px">Actionable behaviours only — things a rep chooses to do.</p>
      ${topWin.length ? topWin.map(r=>`<div style="padding:7px 0;border-bottom:1px dotted var(--line);font-size:13.5px">
        <strong style="color:var(--won)">+${r.diff}</strong> ${esc(r.label)}
        <div class="mono" style="color:var(--muted);font-size:11px">${r.closed_pct}% of closed vs ${r.other_pct}% of the rest</div>
      </div>`).join("") : `<p style="color:var(--muted);margin:0">Nothing separates cleanly yet.</p>`}
    </div>
    <div class="panel" style="border-color:var(--lost)">
      <h3 style="color:var(--lost)">Most enriched in deals that didn't close</h3>
      <p class="sub" style="font-size:13px">Includes prospect traits — those are a targeting signal, not a coaching one.</p>
      ${topLose.map(r=>`<div style="padding:7px 0;border-bottom:1px dotted var(--line);font-size:13.5px">
        <strong style="color:var(--lost)">${r.diff}</strong> ${esc(r.label)}
        <div class="mono" style="color:var(--muted);font-size:11px">${r.other_pct}% of non-closed vs ${r.closed_pct}% of closed</div>
      </div>`).join("")}
    </div>
  </div>`;
  }

  /* ---------- Integrity flags ---------- */
  function flagsSection(d){
    const F = d.rollups.flags;
    if (!F || !F.total) return "";
    const SEV = { critical:["Critical","var(--lost)"], high:["High","var(--lost)"],
                  medium:["Medium","var(--warn)"], low:["Low","var(--muted)"] };
    const CAT = {
      clinical_risk:"Clinical risk", pricing_deviation:"Pricing deviation",
      policy_contradiction:"Policy contradiction", mis_selling:"Mis-selling risk",
      conduct:"Conduct", data_integrity:"Data integrity", compliance:"Compliance",
    };
    const crit = F.by_severity.critical || 0, high = F.by_severity.high || 0;
    // Spread the sample across categories so one dominant category cannot
    // crowd the others out of view.
    const critSample = (() => {
      const byCat = {};
      (F.urgent || []).filter(f => f.severity === "critical")
        .forEach(f => (byCat[f.category] = byCat[f.category] || []).push(f));
      const out = [], keys = Object.keys(byCat);
      for (let i = 0; out.length < 20 && keys.some(k => byCat[k].length); i++)
        for (const k of keys) if (byCat[k].length && out.length < 20) out.push(byCat[k].shift());
      return out;
    })();

    const row = f => {
      const [sl,sc] = SEV[f.severity] || ["—","var(--muted)"];
      return `<details style="border-left:3px solid ${sc}">
        <summary>
          <span class="tag" style="background:color-mix(in srgb,${sc} 18%,transparent);color:${sc}">${sl}</span>
          <span style="margin-left:7px">${esc(CAT[f.category]||f.category)}</span>
          <div style="color:var(--muted);font-weight:400;font-size:13.5px;margin-top:6px">${esc(f.summary)}</div>
        </summary>
        ${(f.evidence||[]).map(e=>`<div class="q" style="border-color:${sc}">${esc(e)}</div>`).join("")}
        <div class="mono" style="color:var(--muted);font-size:11.5px;margin-top:8px">
          ${esc(f.date||"")}${f.timestamp?" · "+esc(f.timestamp):""}
          ${f.source_type==="internal"?' · <span style="color:var(--accent)">internal call</span>':""}
        </div></details>`;
    };

    return `
  <h2>Integrity flags</h2>
  <p class="sub">Everything the audit surfaced that isn't a script-adherence question — clinical risk,
  pricing that departs from the documented offer, policy contradictions, conduct, and anything that
  biases the corpus itself. ${F.total} flags across ${F.calls_flagged} calls, including
  ${F.internal_calls_reviewed} internal call${F.internal_calls_reviewed===1?"":"s"} that are excluded
  from every sales metric but reviewed for exactly this.</p>

  ${crit ? `<div class="banner" style="border-color:var(--lost);background:color-mix(in srgb,var(--lost) 10%,transparent)">
    <strong style="color:var(--lost)">${crit} critical flag${crit===1?"":"s"} needing a human decision.</strong>
    Critical means someone could be physically harmed or it is a legal exposure — not that a deal was
    handled badly. These are listed first below, with the quotes they rest on.
  </div>` : ""}

  <div class="grid g4" style="margin:var(--s4) 0">
    ${stat(F.total,"Flags raised","across the corpus")}
    ${stat(crit,"Critical","physical or legal exposure")}
    ${stat(high,"High","material money or trust")}
    ${stat(F.calls_flagged,"Calls affected","")}
  </div>

  <div class="scroll" style="margin-bottom:var(--s5)"><table>
    <thead><tr><th>Category</th><th style="width:80px">Flags</th>
      <th style="width:90px">Calls</th><th style="width:230px">Severity mix</th></tr></thead>
    <tbody>${F.by_category.map(c=>`<tr${c.critical?' class="warnrow"':""}>
      <td><strong>${esc(CAT[c.category]||c.category)}</strong></td>
      <td><span class="num" style="font-size:22px">${c.n}</span></td>
      <td class="mono" style="color:var(--muted)">${c.calls}</td>
      <td style="font-size:12px">
        ${c.critical?`<span class="chip" style="color:var(--lost);border-color:var(--lost)">critical ×${c.critical}</span>`:""}
        ${c.high?`<span class="chip" style="color:var(--lost);border-color:var(--lost)">high ×${c.high}</span>`:""}
        ${c.medium?`<span class="chip" style="color:var(--warn);border-color:var(--warn)">medium ×${c.medium}</span>`:""}
        ${c.low?`<span class="chip">low ×${c.low}</span>`:""}</td>
    </tr>`).join("")}</tbody>
  </table></div>

  ${(F.systemic||[]).length ? `
  <h3>Recurring — the same issue across multiple calls</h3>
  <p class="sub">Flags clustered by what they describe, so one systemic problem reads as one finding with
  a count rather than dozens of near-identical rows. These are the ones worth fixing at the process level.</p>
  ${F.systemic.map(c=>{
    const [sl,sc] = SEV[c.severity] || ["—","var(--muted)"];
    return `<details style="border-left:3px solid ${sc}">
      <summary>
        <span class="num" style="font-size:22px;color:${sc}">${c.n}×</span>
        <span class="tag" style="background:color-mix(in srgb,${sc} 18%,transparent);color:${sc};margin-left:8px">${sl}</span>
        <span style="margin-left:7px">${esc(CAT[c.category]||c.category)}</span>
        <div style="color:var(--muted);font-weight:400;font-size:13.5px;margin-top:6px">${esc(c.exemplar)}</div>
      </summary>
      <div style="margin-top:10px;font-size:13px;color:var(--muted)">
        Across ${c.calls.length} call${c.calls.length===1?"":"s"}${c.reps.length>1?` · ${c.reps.length} different reps`:""}
        ${c.date_range[0]?` · ${esc(c.date_range[0])} → ${esc(c.date_range[1])}`:""}
      </div>
      ${(c.evidence||[]).map(e=>`<div class="q" style="border-color:${sc}">${esc(e)}</div>`).join("")}
      </details>`;}).join("")}` : ""}

  ${F.urgent.length ? `<h3 style="margin-top:var(--s6);color:var(--lost)">Critical — sample</h3>
  <p class="sub">${F.by_severity.critical||0} critical flags in total. The clusters above are the view that
  matters — one systemic problem read as one finding. Showing ${Math.min(critSample.length, 8)} individual
  flags spanning every category, so the counts above are not taken on trust. The rest are in
  <span class="mono">data/scores/parts/*.flags.json</span>.</p>
  ${critSample.slice(0,8).map(row).join("")}` : ""}`;
  }

  /* ---------- Where deals die ---------- */
  function funnelSection(d){
    const F = d.rollups.funnel, DS = d.rollups.duration_summary;
    const worst = F.filter(f=>f.died_here>0).sort((a,b)=>b.died_here-a.died_here)[0];

    return `
  <h2>Where deals die</h2>
  <p class="sub">Every deal's furthest point through the call. A deal counts as reaching a stage if any of
  its calls got there. This is the drop-off view — it shows whether you are losing people on discovery, on
  price, or on the handling afterwards.</p>

  <div class="scroll" style="margin-bottom:var(--s3)"><table>
    <thead><tr><th style="width:44px">#</th><th>Stage</th><th style="width:280px">Reached</th>
      <th style="width:150px">Died here</th></tr></thead>
    <tbody>${F.map(f=>{
      const isWorst = worst && f.stage===worst.stage;
      const col = f.pct>=80?"var(--won)":f.pct>=40?"var(--warn)":"var(--lost)";
      return `<tr${isWorst?' class="warnrow"':""}>
        <td class="mono" style="color:var(--muted)">${f.stage}</td>
        <td><strong>${esc(f.label)}</strong>${isWorst?' <span class="tag t-lost">biggest drop</span>':""}</td>
        <td><span class="num" style="font-size:20px;color:${col}">${f.pct}%</span>
            <span class="mono" style="color:var(--muted)"> ${f.reached}/${d.corpus.deals}</span>
            <div class="bar"><i style="width:${f.pct}%;background:${col}"></i></div></td>
        <td>${f.died_here
          ? `<span class="num" style="font-size:20px;color:var(--lost)">${f.died_here}</span>
             <span class="mono" style="color:var(--muted)"> ${pct(f.died_here,d.corpus.deals)}% of deals</span>`
          : '<span style="color:var(--muted)">—</span>'}</td>
      </tr>`;}).join("")}</tbody>
  </table></div>

  <div class="panel" style="border-color:var(--accent);margin-bottom:var(--s5)">
    <h3 style="color:var(--accent)">Nothing is dying in discovery</h3>
    <p style="color:var(--muted);margin:0">Every deal reaches the price. Discovery, the deep why, the
    commitment check and the offer all convert at 100%. The entire loss happens in one place —
    <strong>after the number is on the table</strong>, at ${esc(worst?worst.label.toLowerCase():"objection handling")}.
    That means the problem is not lead quality or rapport; it is what happens in the ninety seconds after
    the price lands. Which is the same conclusion the objection-play table reaches independently.</p>
  </div>

  <h3>Call length against outcome</h3>
  <p class="sub">Bucketed, because the per-minute view is noise. Closed calls average
  <strong>${DS.closed_avg} min</strong> against <strong>${DS.other_avg} min</strong> for everything else.</p>
  <div class="scroll" style="margin-bottom:var(--s3)"><table>
    <thead><tr><th style="width:130px">Length</th><th style="width:110px">Calls</th>
      <th style="width:90px">Share</th><th style="width:230px">Close rate</th></tr></thead>
    <tbody>${(d.rollups.duration_buckets||[]).map(b=>{
      const col = b.close_rate>=30?"var(--won)":b.close_rate>=15?"var(--warn)":"var(--lost)";
      return `<tr>
        <td><strong>${esc(b.label)}</strong></td>
        <td><span class="num" style="font-size:22px">${b.n}</span></td>
        <td class="mono" style="color:var(--muted)">${b.share}%</td>
        <td><span class="num" style="font-size:22px;color:${col}">${b.close_rate}%</span>
            <span class="mono" style="color:var(--muted)"> ${b.closed}/${b.n}</span>
            <div class="bar"><i style="width:${b.close_rate}%;background:${col}"></i></div></td>
      </tr>`;}).join("")}</tbody>
  </table></div>
  <p class="sub">Read this as a symptom, not a lever. A call runs long <em>because</em> it is going well —
  telling reps to stretch calls would not reproduce the effect. The useful signal is the short end: calls
  that end early ended early for a reason.</p>`;
  }

  /* ---------- ICP ---------- */
  function icpSection(d){
    const I = d.rollups.icp, C = d.rollups.icp_criteria;
    const FIT = {core:["Core ICP","var(--won)"], edge:["Edge","var(--warn)"], outside:["Outside","var(--lost)"]};
    const FIT_BLURB = {
      core:"Meets every stated criterion. Closes at more than double the corpus rate — the offer works "
          +"exactly as designed on these people.",
      edge:"Meets some criteria, misses others. The bulk of the corpus, and the bulk of the wasted call time.",
      outside:"Fails most of the definition. Should not have reached a sales call at all; the cost of these "
             +"is measured in rep hours, not lost revenue."
    };
    const total = I.fit_counts.reduce((s,f)=>s+f.n,0) || 1;
    return `
  <h2>ICP — stated vs. actual</h2>
  <p class="sub">The avatars describe who shows up. This describes who Primal <em>says</em> it wants, and
  whether those are the same people. The definition below is quoted from a live call, not a marketing doc —
  it is what prospects are actually told.</p>

  <div class="panel" style="border-color:var(--accent);margin-bottom:var(--s3)">
    <h3 style="color:var(--accent)">The ICP as stated on a call</h3>
    <div class="q" style="border-color:var(--accent)">“${esc(I.stated.quote)}”</div>
    <div class="mono" style="color:var(--muted);margin-top:8px">
      ${esc(I.stated.source_rep)} · ${esc(I.stated.timestamp)}</div>
    <div style="margin-top:10px">${I.stated.criteria.map(c=>
      `<span class="chip">${esc(c.label)}</span>`).join("")}</div>
  </div>

  <div class="grid g3" style="margin-bottom:var(--s5)">
    ${I.fit_counts.map(f=>{
      const [lab,col]=FIT[f.fit]||[f.fit,"var(--muted)"];
      const share = pct(f.n, total);
      return box({
        big: f.close_rate+"%", tone: col, label: lab+" — "+f.n+" deals", bar: f.close_rate,
        meta: `close rate · ${share}% of the corpus`,
        blurb: FIT_BLURB[f.fit] || ""
      });}).join("")}
  </div>

  <h3>Which criterion actually fails</h3>
  <p class="sub">The five stated criteria, scored against every one of the ${I.assessments_total}
  prospects assessed. This replaces reading them one prospect at a time: if you want to know why so few
  people are core ICP, it is the top row, and only the top row.</p>
  <div class="scroll" style="margin-bottom:var(--s3)"><table>
    <thead><tr><th>Criterion</th><th style="width:190px">Missed</th>
      <th style="width:110px">Core</th><th style="width:110px">Edge</th>
      <th style="width:110px">Outside</th></tr></thead>
    <tbody>${(C||[]).map((c,i)=>{
      const col = c.miss_pct>=50?"var(--lost)":c.miss_pct>=30?"var(--warn)":"var(--won)";
      const cell = f => {
        const b=c.by_fit[f]||{matched:0,missed:0}, d=b.matched+b.missed;
        const p = d?Math.round(b.missed/d*100):0;
        return `<td><span class="mono" style="color:${p>=50?"var(--lost)":p>=30?"var(--warn)":"var(--muted)"}">${p}% miss</span></td>`;
      };
      return `<tr${i===0?' class="warnrow"':""}>
        <td><strong>${esc(c.label)}</strong></td>
        <td><span class="num" style="font-size:22px;color:${col}">${c.miss_pct}%</span>
            <span class="mono" style="color:var(--muted)"> ${c.missed}/${c.assessed}</span>
            <div class="bar"><i style="width:${c.miss_pct}%;background:${col}"></i></div></td>
        ${cell("core")}${cell("edge")}${cell("outside")}
      </tr>`;}).join("")}</tbody>
  </table></div>
  ${C && C.length ? `<div class="panel" style="border-color:var(--accent)">
    <h3 style="color:var(--accent)">One criterion is doing all the filtering</h3>
    <p style="color:var(--muted);margin:0"><strong>${esc(C[0].label)}</strong> is missed on
    ${C[0].miss_pct}% of assessed prospects — and never once on a core-ICP prospect. Every other criterion
    is met more often than not. That makes it the single qualifying question worth asking before a call is
    booked, rather than discovered forty minutes into one.</p>
  </div>` : ""}

  ${I.observations.map(o=>`<details style="margin-top:var(--s3)">
    <summary style="color:var(--accent)">${esc(o.finding)}</summary>
    <p style="color:var(--muted);margin:10px 0 0">${esc(o.detail)}</p></details>`).join("")}`;
  }

  /* ---------- Offer signals ---------- */
  function offerSection(d){
    const R = d.rollups, C = R.offer_consistency, P = R.pillars,
          A = R.anchor_directions, AT = R.anchor_themes,
          UT = R.unmet_themes, T = R.unmet_totals || {};
    const REACT = {enthusiastic:["Enthusiastic","var(--won)"], accepted:["Accepted","var(--won)"],
                   clarifying:["Needed clarifying","var(--warn)"], confused:["Confused","var(--lost)"],
                   objected:["Objected","var(--lost)"], not_presented:["Not presented","var(--muted)"]};
    const VERDICT = {product_gap:["Product gap","var(--lost)"],
                     positioning_gap:["Positioning gap","var(--warn)"],
                     out_of_icp:["Out of ICP","var(--muted)"],
                     unvalidated:["Unvalidated","var(--warn)"]};

    return `
  <h2>The offer</h2>
  <p class="sub">How consistently the offer is presented, which parts land, what prospects price it
  against, and what they ask for that it does not do.</p>

  <div class="banner" style="border-color:var(--lost);background:color-mix(in srgb,var(--lost) 8%,transparent)">
    <strong style="color:var(--lost)">The guarantee is described ${C.distinct_versions} different ways,
    and ${C.never_mentioned} of ${C.total_calls} calls never mention one at all.</strong>
    This is not a sample-size problem — it is visible in every call reviewed. A guarantee is the single
    highest-leverage line in a high-ticket offer, and right now the prospect's understanding of what they
    are protected by depends entirely on who picked up the call.
  </div>

  <div class="grid g4" style="margin:var(--s4) 0 var(--s5)">
    ${stat(C.distinct_versions,"Distinct guarantees","different wordings on record")}
    ${stat(pct(C.never_mentioned,C.total_calls)+"%","Calls with no guarantee",C.never_mentioned+" of "+C.total_calls)}
    ${stat(C.calls_with_offer,"Calls presenting the offer","of "+C.total_calls+" total")}
    ${stat(Math.round(C.distinct_versions/Math.max(1,C.total_calls-C.never_mentioned)*100)+"%",
           "Wordings per mention","100% means no two calls said the same thing")}
  </div>

  <h3>Tier exposure</h3>
  <p class="sub">Which price points prospects were actually shown.</p>
  <div class="grid g2" style="margin-bottom:var(--s5)">
    ${C.tiers.map(t=>{
      const pctShown = Math.round(t.calls/C.total_calls*100);
      const dead = pctShown < 50;
      return `<div class="panel" style="border-color:${dead?"var(--lost)":"var(--won)"}">
        <h3>${t.months} months — $${t.price_usd.toLocaleString()}</h3>
        <p style="margin:0;color:var(--muted)">Presented on <strong>${t.calls} of ${C.total_calls}</strong>
        calls (${pctShown}%).${dead?" <strong style='color:var(--lost)'>Effectively dormant.</strong> Either retire it or train it — right now most prospects never learn it exists.":""}</p>
      </div>`;}).join("")}
  </div>

  <h3>Which pillars land, which create friction</h3>
  <p class="sub">Reaction to each of the three pillars as delivered. Friction means the prospect was
  confused or pushed back; clean means understood and accepted with no questions.</p>
  <div class="scroll" style="margin-bottom:var(--s3)"><table>
    <thead><tr><th>Pillar</th><th style="width:150px">Landed clean</th>
      <th style="width:150px">Friction</th><th>Reactions</th></tr></thead>
    <tbody>${P.map(p=>`<tr>
      <td><strong>${esc(p.name)}</strong>
          <div class="mono" style="color:var(--muted)">presented on ${p.presented} of ${d.corpus.calls_ingested}</div></td>
      <td><span class="num" style="font-size:20px;color:var(--won)">${p.clean_pct}%</span>
          <div class="bar"><i style="width:${p.clean_pct}%;background:var(--won)"></i></div></td>
      <td><span class="num" style="font-size:20px;color:${p.friction_pct>=40?"var(--lost)":p.friction_pct>0?"var(--warn)":"var(--muted)"}">${p.friction_pct}%</span>
          <div class="bar"><i style="width:${p.friction_pct}%;background:var(--lost)"></i></div></td>
      <td style="font-size:12px">${Object.entries(p.reactions).map(([k,v])=>{
        const [lab,col]=REACT[k]||[k,"var(--muted)"];
        return `<span class="chip" style="color:${col};border-color:${col}">${lab} ×${v}</span>`;}).join("")}</td>
    </tr>`).join("")}</tbody>
  </table></div>
  <h3 style="margin-top:var(--s6)">What prospects price you against</h3>
  <p class="sub">The number or product already in their head when they hear $6,000. All
  <strong>${(R.anchor_theme_total||0).toLocaleString()}</strong> anchors in the corpus, sorted into
  ${(AT||[]).filter(t=>t.key!=="other").length} themes plus a reported remainder — the raw labels ran to 852
  distinct strings, which is a vocabulary problem rather than eight hundred different situations.
  <em>Undercuts</em> is the share of that theme arguing the price down.</p>
  <div class="grid g2" style="margin-bottom:var(--s3)">
    ${A.map(a=>{
      const good = a.direction==="supports_price";
      const col = good?"var(--won)":"var(--lost)";
      return `<div class="stat" style="border-color:${col}">
        <div class="n" style="color:${col}">${a.close_rate}%</div>
        <div class="l">${good?"Anchors that support price":"Anchors that undercut price"}</div>
        <div class="f">${a.n} anchors · close rate of the deals carrying them</div>
      </div>`;}).join("")}
  </div>
  <div class="grid g3" style="margin-bottom:var(--s5)">
    ${(AT||[]).map(t=>box({
      big: t.close_rate+"%", tone: rateTone(t.close_rate), label: t.label, bar: t.close_rate,
      meta: `close rate · ${t.n} anchors · ${t.share}% of all`,
      blurb: t.blurb,
      foot: `<span style="color:${t.undercut_pct>=70?"var(--lost)":"var(--muted)"}">
              ${t.undercut_pct}% of these argue the price down</span>`
    })).join("")}
  </div>

  <h3>Demand you don't serve</h3>
  <p class="sub">Things prospects asked for that the offer does not currently do —
  <strong>${(R.unmet_theme_total||0).toLocaleString()}</strong> requests, themed. Every want was recorded as
  a distinct sentence, so a list of them is a list of a thousand sentences; these are the six recurring
  shapes, covering ${(UT||[]).slice(0,6).reduce((s,t)=>s+t.share,0)}% of all of them.
  <em>Product gap</em> is the share of the theme judged to need building rather than saying.</p>
  <div class="grid g4" style="margin-bottom:var(--s3)">
    ${Object.entries(T).sort((a,b)=>b[1]-a[1]).map(([v,cnt])=>{
      const [lab,col]=VERDICT[v]||[v,"var(--muted)"];
      return `<div class="stat" style="border-color:${col}">
        <div class="n" style="color:${col}">${cnt.toLocaleString()}</div>
        <div class="l">${lab}</div>
        <div class="f">${pct(cnt, Object.values(T).reduce((s,x)=>s+x,0))}% of unmet requests</div>
      </div>`;}).join("")}
  </div>
  <div class="grid g3">
    ${(UT||[]).slice(0,6).map(t=>box({
      big: t.n.toLocaleString(), tone: t.product_gap_pct>=40?"var(--lost)":"var(--warn)",
      label: t.label, bar: t.share*2.5,
      meta: `${t.share}% of unmet demand`,
      blurb: t.blurb,
      foot: `<span style="color:${t.product_gap_pct>=40?"var(--lost)":"var(--muted)"}">
              ${t.product_gap_pct}% judged a product gap</span> · ${100-t.product_gap_pct}% positioning or unvalidated`
    })).join("")}
  </div>`;
  }

  /* ---------- What separates closed from not closed ---------- */
  function discriminatorSection(d){
    const D = d.rollups.discriminators;
    const KIND = {
      check:"Script move", phase:"Script section", phase_full:"Script section",
      pain:"Pain", goal:"Goal", objection:"Objection", objection_resolved:"Objection",
      play:"Objection play", structural:"Structural"
    };
    const sig = r => {
      const p = r.diff>0 ? r.p_enriched : r.p_depleted;
      if (p <= .05) return ["Significant","var(--won)"];
      if (p <= .15) return ["Suggestive","var(--warn)"];
      return ["Noise-level","var(--muted)"];
    };
    const card = (r) => {
      const [sLab,sCol] = sig(r);
      const tone = r.diff>0 ? "var(--won)" : "var(--lost)";
      const p = r.diff>0 ? r.p_enriched : r.p_depleted;
      return `<tr>
        <td><strong style="font-size:13.5px">${esc(r.label)}</strong>
            <div class="mono" style="color:var(--muted);font-size:11px">${esc(KIND[r.kind]||r.kind)}</div></td>
        <td><span class="num" style="font-size:20px;color:${tone}">${r.diff>0?"+":""}${r.diff}</span>
            <div class="bar"><i style="width:${Math.abs(r.diff)}%;background:${tone}"></i></div></td>
        <td style="font-size:12.5px;color:var(--muted)">${esc(r.statement)}</td>
        <td><span class="tag" style="background:color-mix(in srgb,${sCol} 16%,transparent);color:${sCol}">${sLab}</span>
            <div class="mono" style="color:var(--muted);margin-top:4px">p=${p}</div></td>
      </tr>`;
    };

    const win = D.top_favours_close.slice(0,6);
    const lose = D.top_favours_loss.slice(0,6);
    const perfectWin = D.top_favours_close.filter(r=>r.perfect);

    return `
  <h2>What separates closed from not closed</h2>
  <p class="sub">Every pain, goal, objection, script section and individual scripted move, tested for whether
  it shows up more in deals that closed or deals that didn't. Measured per <strong>deal</strong>.
  ${D.features_tested} features tested across ${D.groups.closed} closed and ${D.groups.not_closed} non-closed
  deals. <strong>${esc((D.excluded_circular||[]).join(", "))}</strong> is excluded — taking payment and
  booking onboarding is <em>how a deal gets marked closed</em>, so “closed deals did it” restates the rule
  rather than explaining it.</p>

  <div class="banner" style="border-color:var(--lost);background:color-mix(in srgb,var(--lost) 8%,transparent)">
    <strong style="color:var(--lost)">At this sample size, nothing on this page can be true yet.</strong>
    With ${D.groups.closed} closed and ${D.groups.not_closed} non-closed deals, the best p-value the maths can
    physically produce is <strong>${D.p_floor}</strong> — so even a flawless separator cannot reach
    significance. ${D.perfect_separators} features separate the groups perfectly, but roughly
    <strong>${D.expected_perfect_by_chance}</strong> would do that from pure luck with this many features and
    this few deals. <strong>You would need about ${D.deals_needed_for_significance} deals</strong> before a
    clean separator means anything. The engine below is built and correct; it is waiting on data, and that is
    the honest reason to run the full corpus.
  </div>

  <div class="grid g4" style="margin:var(--s4) 0">
    ${stat(D.features_tested,"Features tested","pains, goals, objections, script moves")}
    ${stat(D.perfect_separators,"Perfect separators","~"+D.expected_perfect_by_chance+" expected by chance")}
    ${stat(D.p_floor,"Best possible p","ceiling at current group sizes")}
    ${stat(D.deals_needed_for_significance||"—","Deals needed","for a clean separator to hold up")}
  </div>

  <h3 style="margin-top:var(--s6);color:var(--won)">● Present in closed, absent in the rest</h3>
  <p class="sub">Read as: “every closed deal did this, no other deal did.” Candidate causes of winning.</p>
  <div class="scroll" style="margin-bottom:var(--s5)"><table>
    <thead><tr><th>Feature</th><th style="width:130px">Gap (pts)</th>
      <th style="width:260px">Split</th><th style="width:130px">Signal</th></tr></thead>
    <tbody>${win.map(card).join("")}</tbody>
  </table></div>

  <h3 style="color:var(--lost)">▲ Present in non-closed, absent or rarer in closed</h3>
  <p class="sub">Read as: “the deals that didn't close all had this.” Candidate causes of losing.</p>
  <div class="scroll" style="margin-bottom:var(--s5)"><table>
    <thead><tr><th>Feature</th><th style="width:130px">Gap (pts)</th>
      <th style="width:260px">Split</th><th style="width:130px">Signal</th></tr></thead>
    <tbody>${lose.map(card).join("")}</tbody>
  </table></div>

  <div class="grid g2">
    <div class="panel" style="border-color:var(--accent)">
      <h3 style="color:var(--accent)">The one to watch when real data lands</h3>
      <p style="color:var(--muted);margin:0 0 10px">Of the ${perfectWin.length} clean separators favouring
      close, the ones that are <em>actionable</em> — a rep can choose to do them — matter more than the ones
      that are just descriptions of the prospect. Sorted that way, the leaders are script behaviours, not
      prospect traits:</p>
      ${perfectWin.filter(r=>["check","phase","phase_full","play"].includes(r.kind)).slice(0,4)
        .map(r=>`<div class="q" style="border-color:var(--won)">${esc(r.label)}</div>`).join("")}
      <p style="color:var(--muted);margin:10px 0 0;font-size:13px">That distinction is the difference between
      “we should coach this” and “we should target that”.</p>
    </div>
    <div class="panel" style="border-color:var(--warn)">
      <h3 style="color:var(--warn)">Two different jobs, not a ranking</h3>
      <p style="color:var(--muted);margin:0">Script moves describe what the rep <em>did</em> — those are the
      coaching list, and they get weighted first for sales. Pains and goals describe who <em>walked in</em> —
      those are the marketing list, and they answer a different question: what do people actually want, and
      which of those wants brings in buyers. Neither outranks the other; they feed different teams.
      The demand tables under Pains &amp; goals below are the marketing view.</p>
    </div>
  </div>`;
  }

  /* ---------- Avatars, aggregated ---------- */
  function avatarSection(d){
    const rows = d.rollups.avatars, deals = d.corpus.deals;
    return `
  <h2>Avatars</h2>
  <p class="sub">Prospect types across the whole corpus — how many of each, and how well each converts.
  Counted per <strong>deal</strong>, not per call, so close rate is real. Provisional at this sample size:
  built from ${deals} deals, so treat the rates as directions to test rather than facts.</p>
  <div class="scroll" style="margin-bottom:var(--s3)"><table>
    <thead><tr><th>Avatar</th><th style="width:80px">Deals</th><th style="width:90px">Share</th>
      <th style="width:180px">Close rate</th><th style="width:110px">Cash</th><th>Outcomes</th></tr></thead>
    <tbody>${rows.map(a=>{
      const meta = AVATARS[a.avatar]||{name:a.avatar,blurb:""};
      const col = a.close_rate>=60?"var(--won)":a.close_rate>=30?"var(--warn)":"var(--lost)";
      return `<tr>
        <td><strong>${esc(meta.name)}</strong></td>
        <td><span class="num" style="font-size:26px">${a.deals}</span></td>
        <td class="mono" style="color:var(--muted)">${pct(a.deals,deals)}%</td>
        <td><span class="num" style="font-size:22px;color:${col}">${a.close_rate}%</span>
            <div class="bar"><i style="width:${a.close_rate}%;background:${col}"></i></div></td>
        <td class="mono">${a.cash?"$"+a.cash.toLocaleString():"—"}</td>
        <td style="font-size:12px">
          ${a.closed?`<span class="tag t-closed">${a.closed} closed</span> `:""}
          ${a.follow_up?`<span class="tag t-follow">${a.follow_up} follow up</span> `:""}
          ${a.lost?`<span class="tag t-lost">${a.lost} lost</span>`:""}</td>
      </tr>`;}).join("")}</tbody>
  </table></div>
  <p class="sub">What each type looks like on a call:</p>
  ${rows.map(a=>{ const m=AVATARS[a.avatar]||{name:a.avatar,blurb:"",tell:""};
    return `<details><summary>${esc(m.name)} <span style="color:var(--muted);font-weight:400">— ${a.deals} deal${a.deals===1?"":"s"}, ${a.close_rate}% close</span></summary>
      <p style="color:var(--muted);margin:10px 0 8px">${esc(m.blurb)}</p>
      <div class="q">${esc(m.tell)}</div></details>`;}).join("")}`;
  }

  /* ---------- Pains and goals ---------- */
  function painGoalSection(d){
    const PG = d.rollups.pain_groups || [], GG = d.rollups.goal_groups || [];
    const base = pct(d.calls.filter(c=>c.outcome.disposition==="closed").length, d.calls.length);

    // Close rate is only interesting against the corpus baseline — every group
    // sits within a few points of it, and saying so is the finding.
    const groupBoxes = (rows, tone) => rows.map(b=>{
      const delta = b.close_rate - base;
      return box({
        big: b.share+"%", tone,
        label: b.label, bar: b.share,
        meta: `${b.deals} of ${d.corpus.deals} deals · ${b.mentions} mentions`,
        blurb: b.blurb,
        foot: `Closes at <strong style="color:${rateTone(b.close_rate)}">${b.close_rate}%</strong>
               <span style="color:var(--muted)">(${delta>0?"+":""}${delta} vs the ${base}% corpus rate)</span>`
      });}).join("");

    return `
  <h2>Pains &amp; goals</h2>
  <p class="sub">What people are running from and running toward, grouped.
  ${d.counts.pains.toLocaleString()} pains and ${d.counts.goals.toLocaleString()} goals were recorded across
  51 categories — too many to read and too thin individually to trust, so they are rolled into five groups
  each. Counted per <strong>deal</strong>: a deal is in a group if any of its calls raised anything in it.</p>

  <h3 style="color:var(--lost);margin-top:var(--s5)">▲ Pains — what hurts today</h3>
  <div class="grid g3" style="margin-bottom:var(--s5)">${groupBoxes(PG, "var(--lost)")}</div>

  <h3 style="color:var(--won)">● Goals — what they are running toward</h3>
  <div class="grid g3" style="margin-bottom:var(--s5)">${groupBoxes(GG, "var(--won)")}</div>

  <div class="panel" style="border-color:var(--warn)">
    <h3 style="color:var(--warn)">What people want does not predict whether they buy</h3>
    <p style="color:var(--muted);margin:0">Every group above closes within a few points of the
    ${base}% corpus rate. That is a real result, not a null one: it says the wants people arrive with are
    not the lever. Two people with identical goals close or don't close on what happens in the call — which
    puts the weight back on the script sections and the objection buckets, and makes these groups a
    <em>messaging</em> input rather than a targeting one.</p>
  </div>`;
  }

  /* ---------- Call by call, paginated ---------- */
  function callTableSection(d){
    return `
  <h2>Call by call</h2>
  <p class="sub">${d.corpus.calls_ingested} calls across ${d.corpus.deals} deals.
  ${d.corpus.multi_call_deals} deal${d.corpus.multi_call_deals===1?"":"s"} span more than one call.
  Prospect and closer identities are deliberately omitted throughout this dashboard — use the Drive link
  if you need to look a specific call up at source.</p>
  <div class="scroll"><table>
    <thead><tr><th style="width:110px">Date</th><th>Avatar</th>
      <th style="width:110px">Outcome</th><th style="width:100px">Adherence</th>
      <th style="width:100px">Length</th><th style="width:90px">Cash</th>
      <th style="width:90px">Source</th></tr></thead>
    <tbody id="callRows"></tbody>
  </table></div>
  <div id="pager" style="display:flex;gap:var(--s2);align-items:center;justify-content:space-between;
       margin-top:var(--s3);flex-wrap:wrap"></div>`;
  }

  function stat(n,l,f){return `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div><div class="f">${f||""}</div></div>`;}

  drawCalls(1);
}

/* ---------- pagination for the call table ---------- */
const PAGE_SIZE = 25;
function drawCalls(page){
  const d = window.__D;
  const rows = [...d.calls].sort((a,b)=> b.call.date.localeCompare(a.call.date));
  const pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  page = Math.min(Math.max(1, page), pages);
  const slice = rows.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);

  document.getElementById("callRows").innerHTML = slice.map(c=>{
    const [lab,cls] = LABEL[c.outcome.disposition];
    const av = (AVATARS[c.avatar.assigned]||{}).name || c.avatar.assigned;
    const a  = c.adherence ? c.adherence.adherence_pct : null;
    const acol = a==null?"var(--muted)":a>=70?"var(--won)":a>=45?"var(--warn)":"var(--lost)";
    const url = c.source.drive_file_id
      ? "https://drive.google.com/file/d/"+c.source.drive_file_id+"/view" : null;
    return `<tr>
      <td class="mono">${esc(c.call.date)}</td>
      <td style="font-size:13px">${esc(av)}</td>
      <td><span class="tag ${cls}">${lab}</span></td>
      <td><strong style="color:${acol}">${a==null?"—":a+"%"}</strong></td>
      <td class="mono" style="color:var(--muted)">${c.call.duration_min_est?c.call.duration_min_est+" min":"—"}</td>
      <td class="mono">${c.outcome.cash_collected_usd
          ? "$"+c.outcome.cash_collected_usd.toLocaleString() : "—"}</td>
      <td>${url?`<a href="${url}" target="_blank" rel="noopener"
             style="color:var(--accent);font-size:12.5px">Drive ↗</a>`:"—"}</td>
    </tr>`;}).join("");

  const btn = (p,label,on)=> on
    ? `<button onclick="drawCalls(${p})" style="background:var(--chip);color:var(--ink);
         border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 13px;cursor:pointer;
         font-family:var(--font-body);font-size:13px">${label}</button>`
    : `<button disabled style="background:transparent;color:var(--muted);border:1px solid var(--line);
         border-radius:var(--r-sm);padding:6px 13px;font-family:var(--font-body);font-size:13px;
         opacity:.4">${label}</button>`;

  document.getElementById("pager").innerHTML = `
    <span style="color:var(--muted);font-size:13px">
      Showing ${(page-1)*PAGE_SIZE+1}–${Math.min(page*PAGE_SIZE,rows.length)} of ${rows.length} calls</span>
    <span style="display:flex;gap:6px;align-items:center">
      ${btn(page-1,"← Prev",page>1)}
      <span style="color:var(--muted);font-size:13px;padding:0 6px">Page ${page} / ${pages}</span>
      ${btn(page+1,"Next →",page<pages)}
    </span>`;
}
</script>
</body>
</html>
